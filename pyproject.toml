[project]
name = "strands_template"
version = "0.1.0"
description = "Modern Strands Agents starter template — workflow, graph, swarm, MCP, sessions, structured output, hooks"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "strands-agents[anthropic,otel]>=1.0",
    "strands-agents-tools>=0.2",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
strands_template = "strands_template.main:run"
strands-template = "strands_template.main:run"
strands-chat = "strands_template.main:chat"
strands-replay = "strands_template.main:replay"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_template"]

[tool.hatch.build.targets.sdist]
packages = ["src/strands_template"]

[tool.pytest.ini_options]
markers = [
    "integration: hits a real LLM (gated by RUN_INTEGRATION=1)",
]
